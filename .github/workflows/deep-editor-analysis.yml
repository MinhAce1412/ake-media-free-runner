name: Ake Deep Editor Analyze

on:
  push:
    branches: [main]
    paths: ['deep_request.json','scripts/deep_*','scripts/deep_requirements.txt','scripts/refine_scene_evidence.py','scripts/refine_multimodal_evidence.py','scripts/asr_hallucination_guard.py','scripts/clap_sfx_refine.py','scripts/clap_requirements.txt','scripts/music_candidate_id.py','.github/workflows/deep-editor-analysis.yml']

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    env:
      TFHUB_CACHE_DIR: ${{ github.workspace }}/.cache/tfhub
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      AKE_WHISPER_MODEL: small
      AKE_SHAZAM_PYTHON: ${{ github.workspace }}/.shazam-venv/bin/python
      AKE_CLAP_PYTHON: ${{ github.workspace }}/.clap-venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - name: Resolve deep request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python -c 'import json; d=json.load(open("deep_request.json")); print(d.get("url",""))')"
          ID="$(python -c 'import json; d=json.load(open("deep_request.json")); print(d.get("content_id",""))')"
          MEDIA="$(python -c 'import json; d=json.load(open("deep_request.json")); print(d.get("media_url",""))')"
          START="$(python -c 'import json; d=json.load(open("deep_request.json")); print(d.get("start",0))')"
          END="$(python -c 'import json; d=json.load(open("deep_request.json")); print(d.get("end",0))')"
          EXPECTED="$(python -c 'import json; d=json.load(open("deep_request.json")); print(d.get("expected_duration",0))')"
          RUN="$(python -c 'import json; d=json.load(open("deep_request.json")); print(str(d.get("run",False)).lower())')"
          echo "should_run=$RUN" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "content_id=$ID" >> "$GITHUB_OUTPUT"; echo "media_url=$MEDIA" >> "$GITHUB_OUTPUT"; echo "start=$START" >> "$GITHUB_OUTPUT"; echo "end=$END" >> "$GITHUB_OUTPUT"; echo "expected_duration=$EXPECTED" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.request.outputs.should_run == 'true'
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: scripts/deep_requirements.txt}
      - name: Cache open-source models
        if: steps.request.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/tfhub
          key: ake-deep-models-v2-${{ runner.os }}
      - name: Install free media/editor tools
        if: steps.request.outputs.should_run == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq libsndfile1 tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie libchromaprint-tools
          python -m pip install --upgrade pip && python -m pip install -r scripts/deep_requirements.txt yt-dlp
      - name: Install optional free music recognizer separately
        if: steps.request.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          python -m venv .shazam-venv && .shazam-venv/bin/python -m pip install --upgrade pip && .shazam-venv/bin/python -m pip install shazamio==0.8.1
      - name: Install optional free CLAP SFX classifier separately
        if: steps.request.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          python -m venv .clap-venv && .clap-venv/bin/python -m pip install --upgrade pip && .clap-venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && .clap-venv/bin/python -m pip install -r scripts/clap_requirements.txt
      - name: Acquire media and build deep editor evidence
        if: steps.request.outputs.should_run == 'true'
        run: bash scripts/deep_analyze_media.sh '${{ steps.request.outputs.url }}' '${{ steps.request.outputs.content_id }}' '${{ steps.request.outputs.media_url }}' '${{ steps.request.outputs.start }}' '${{ steps.request.outputs.end }}' '${{ steps.request.outputs.expected_duration }}'
      - name: Upload deep evidence only
        if: steps.request.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ake-deep-${{ github.run_id }}
          path: output/deep/
          if-no-files-found: error
          retention-days: 3
